<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syntaxwear - Loja de Tênis Online" />
    <title>SyntaxeWear - Tênis e Sneakers Online</title>
    <meta
      name="description"
      content="Compre os melhores tênis e sneakers online na Syntaxwear. Encontre modelos exclusivos, ofertas imperdíveis e frete grátis para todo o Brasil." />
    <!-- É o que aparece nos sites de busca. -->

    <link rel="stylesheet" href="./assets/css/components/reset.css" />
    <link rel="stylesheet" href="./assets/css/components/variables.css" />
    <link rel="stylesheet" href="./assets/css/components/base.css" />
    <link rel="stylesheet" href="./assets/css/components/layout.css" />
    <link rel="stylesheet" href="./assets/css/components/header.css" />
    <link rel="stylesheet" href="./assets/css/components/hero/hero.css" />
    <link rel="stylesheet" href="./assets/css/components/products-card.css" />
    
  </head>
  <body>
    <!-- Header com logo e navegação -->
    <header class="header">
      <h1 class="logo">
        <a href="/" aria-label="SyntaxeWear - Tênis e Sneakers Online">
          <img
            src="./assets/images/logo/logo.svg"
            alt="SyntaxeWear - Tênis e Sneakers Online" />
        </a>
      </h1>

      <nav class="nav-center" aria-label="Categorias-principais">
        <!--fornece um rótulo de texto invisível para os leitores de tela -->
        <ul>
          <li><a href="#" aria-label="Masculino">Masculino</a></li>
          <li><a href="#" aria-label="Feminino">Feminino</a></li>
          <li><a href="#" aria-label="Outlet">Outlet</a></li>
        </ul>
      </nav>

      <nav class="nav-right" aria-label="Menu direito">
        <ul>
          <li><a href="#" aria-label="Nossas lojas">Nossas lojas</a></li>
          <li><a href="#" aria-label="Sobre">Sobre</a></li>

          <li>
            <a href="#" aria-label="Minha conta">
              <img src="./assets/images/icons/user.svg" alt="" />
            </a>
          </li>

          <li>
            <a href="#" aria-label="Ajuda">
              <img src="./assets/images/icons/help.svg" alt="" />
            </a>
          </li>

          <li>
            <a href="#" title="Carrinho" aria-label="Carrinho">
              <img src="./assets/images/icons/bag.svg" alt="" />
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main>
      <!-- Seção Herói -->
      <section class="hero-section">
        <div class="hero-overlay">
          <div class="hero-content">
            <span class="hero-subtitle">Krypton One</span>
            <h2 class="hero-title">Transforme qualquer passo em presença.</h2>

            <div class="hero-buttons">
              <a href="#" class="btn btn-outline" aria-label="Ver modelos">
                Ver modelos
              </a>
              <a href="#" class="btn btn-filled" aria-label="Comprar">
                Comprar
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- Seção de Categorias de Tênis -->
      <section class="categorias">
        <!-- Categorias de tênis serão adicionadas aqui -->

        <div class="categorias-container">
          <div class="card">
            <a href="#" class="category-link" title="Casual">
                            <span class="overlay"></span>
              
              <span class="category-name btn btn-outline">Casual</span>
              <img
                src="./assets/images/banners/casual.jpg"
                alt="Tênis branco casual" />
            </a>
          </div>

          <div class="card">
            <a href="#" class="category-link" title="Esporte">
                            <span class="overlay"></span>
              
              <span class="category-name btn btn-outline">Esporte</span>
              <img
                src="./assets/images/banners/esportivo.jpg"
                alt="Tênis Esportivo" />
            </a>
          </div>

          <div class="card">
            <a href="#" class="category-link"  title="Moderno">
                          <span class="overlay"></span>
              <span class="category-name btn btn-outline">Moderno</span>
              <img
                src="./assets/images/banners/moderno.jpg"
                alt="Tênis Moderno" />
            </a>
          </div>

          <div class="card">
            <a href="#" class="category-link" title="Futurista">
                        <span class="overlay"></span>
              <span class="category-name btn btn-outline">Futurista</span><img src="./assets/images/banners/futurista.jpg" alt="Tênis futurista">
            </a>
          </div>
        </div>
      </section>

      <!-- Grid com Produtos em Destaque -->
      <section class="featured-products">
        <div class="container">
          <!-- Produtos em grid serão adicionados aqui -->
        </div>
      </section>
    </main>

    <!-- Footer com Informações de Contato e Links -->
    <footer>
      <div class="container">
        <!-- Informações de contato e links serão adicionados aqui -->
      </div>
    </footer>

    <script src="./assets/script.js"></script>
  </body>
</html>
